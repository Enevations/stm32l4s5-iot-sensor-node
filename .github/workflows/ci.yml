name: CI

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check for unresolved conflict markers
        run: |
          if grep -rEn --include='*.cpp' --include='*.hpp' --include='*.h' \
              --include='*.yml' --include='*.md' \
              '^(<<<<<<<|>>>>>>>) ' . --exclude-dir=.git --exclude-dir=dist; then
            echo "::error::Unresolved conflict markers found in the tree"
            exit 1
          fi

      - name: Configure host tests
        run: cmake -B build/host-tests -S tests -G Ninja

      - name: Build host tests
        run: cmake --build build/host-tests

      - name: Run host tests
        run: ctest --test-dir build/host-tests --output-on-failure

  firmware:
    name: Firmware (debug + release + selftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Cache FetchContent dependencies
        uses: actions/cache@v5
        with:
          path: .cache/deps
          key: fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-

      - name: Build firmware variants
        run: |
          build_variant() {
            local name="$1"
            shift
            cmake -B "build/$name" -S . -G Ninja "$@" \
              -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
              -DFETCHCONTENT_BASE_DIR="$PWD/.cache/deps"
            cmake --build "build/$name" -j
            test -f "dist/$name/stm32l4s5-iot-sensor-node.elf"
            test -f "dist/$name/stm32l4s5-iot-sensor-node.bin"
            test -f "dist/$name/stm32l4s5-iot-sensor-node.hex"
          }
          build_variant debug    -DCMAKE_BUILD_TYPE=Debug
          build_variant release  -DCMAKE_BUILD_TYPE=Release
          build_variant selftest -DCMAKE_BUILD_TYPE=Debug -DSTM32_SELF_TEST=ON

      - name: Upload flashing artifacts
        uses: actions/upload-artifact@v6
        with:
          name: stm32l4s5-firmware-images
          path: dist/
          retention-days: 7
          if-no-files-found: error
